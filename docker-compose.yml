services:
  # ============================================================================
  # Primary Web Application Service (Streamlit Dashboard)
  # ============================================================================
  retinal-oct-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: retinal-oct-detection:latest
    container_name: retinal-oct-app
    restart: unless-stopped
    ports:
      - "${PORT:-8502}:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount models, assets, and outputs for real-time updates without rebuilding
      - ./models:/app/models:ro
      - ./assets:/app/assets:ro
      - ./outputs:/app/outputs:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Optional Training & Benchmarking Service
  # Run on-demand using: docker compose --profile train run --rm retinal-oct-train
  # ============================================================================
  retinal-oct-train:
    build:
      context: .
      dockerfile: Dockerfile
    image: retinal-oct-detection:latest
    container_name: retinal-oct-train
    profiles:
      - train
    entrypoint: ["python", "run_pipeline.py"]
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
